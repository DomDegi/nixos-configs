id          = "domdegi/wallpaper-picker"
name        = "Wallpaper Picker"
version     = "1.0.0"
plugin_api  = 3
author      = "domdegi"
license     = "MIT"
icon        = "photo"
description = "Pick a wallpaper from ~/Pictures/Wallpapers, via wallpaper-pick."
tags        = ["Bar"]

[[widget]]
id    = "widget"
entry = "widget.luau"

# The wallpaper menu opened by the bar widget.
[[panel]]
id        = "panel"
entry     = "panel.luau"
width     = 360
height    = 480
placement = "floating"
position  = "center"
